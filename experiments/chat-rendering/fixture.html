<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat-fixture: running</title>
<style>
  html, body { margin: 0; height: 100%; font: 16px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 8px; }
  .msg { padding: 8px 10px; margin: 6px 0; border-radius: 10px; white-space: pre-wrap; }
  .user { background: #e8f0fe; margin-left: 15%; }
  .assistant { background: #f1f3f4; margin-right: 10%; }
  #bar { display: flex; gap: 6px; padding: 6px; border-top: 1px solid #ccc; }
  #composer { flex: 1; min-height: 48px; font: inherit; }
  #result { font: 12px monospace; padding: 4px 8px; background: #222; color: #0f0; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
</style>
</head>
<body>
<div id="log" aria-live="polite"></div>
<div id="bar"><textarea id="composer" aria-label="Message"></textarea><button id="send">Send</button></div>
<div id="result">running…</div>
<script src="chat-helper.js"></script>
<script>
"use strict";
// Synthetic, deterministic data only. No real chat content, no network.
window.__loadId = Math.random().toString(36).slice(2);
sessionStorage.setItem("loads", String(1 + Number(sessionStorage.getItem("loads") || 0)));
const navType = (performance.getEntriesByType("navigation")[0] || {}).type || "unknown";

/** Fake server: an append-only event log with sequence ids, replayable from a cursor. */
class FakeServer {
  constructor() { this.log = []; }
  push(ev) { ev.seq = this.log.length + 1; this.log.push(ev); return ev; }
  since(cursor) { return this.log.filter(e => e.seq > cursor).map(e => ({ ...e })); }
}

const $ = id => document.getElementById(id);
const scroller = $("log"), composer = $("composer");
const server = new FakeServer();
const view = new ChatHelper.ChatView({ scroller, composer, doc: document });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const resyncs = [];
view.onGap = from => { resyncs.push(from); view.ingest(server.since(from)); };
document.addEventListener("visibilitychange", () => view.setHidden(document.hidden));

const N = Number(new URLSearchParams(location.search).get("n") || 300);
function synthText(i) {
  const words = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta", "eta", "theta"];
  const len = 8 + (i * 37) % 120;
  let s = `#${i} `;
  for (let k = 0; k < len; k++) s += words[(i + k) % words.length] + " ";
  return s.trim();
}

const results = [];
function check(name, ok, detail) { results.push({ name, ok: !!ok, detail }); }
function anchorTop(id) {
  const el = scroller.querySelector(`[data-id="${id}"]`);
  return el.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
}

async function run() {
  // T1 long history initial render
  const t0 = performance.now();
  const hist = [];
  for (let i = 0; i < N; i++) hist.push(server.push({ id: "m" + i, role: i % 2 ? "assistant" : "user", text: synthText(i), done: true }));
  view.ingest(server.since(0));
  await frame();
  const firstRenderMs = performance.now() - t0;
  check("T1 long history renders all messages", scroller.children.length === N && view.store.size === N,
        { n: N, nodes: scroller.children.length, firstRenderMs: +firstRenderMs.toFixed(1), scrollHeight: scroller.scrollHeight });

  // user starts typing a draft with a selection
  composer.focus();
  composer.value = "draft: my unsent question";
  composer.setSelectionRange(7, 9);

  // T2 four streamed updates spaced 1 s while at bottom
  scroller.scrollTop = scroller.scrollHeight; await frame();
  const id = "a-stream";
  server.push({ id, role: "assistant", delta: "Streaming", done: false });
  view.ingest(server.since(view.store.lastSeq));
  for (let k = 1; k <= 3; k++) {
    await sleep(1000);
    server.push({ id, role: "assistant", delta: ` part${k}`, done: k === 3 });
    view.ingest(server.since(view.store.lastSeq));
  }
  await frame();
  const streamEl = scroller.querySelector(`[data-id="${id}"]`);
  const gapBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
  check("T2 4 updates at 1 s, appended in place, stays at bottom", streamEl && streamEl.textContent === "Streaming part1 part2 part3" &&
        scroller.querySelectorAll(`[data-id="${id}"]`).length === 1 && gapBottom < 2, { text: streamEl && streamEl.textContent, gapBottom });
  check("T3 draft, focus and selection preserved", document.activeElement === composer && composer.value === "draft: my unsent question" &&
        composer.selectionStart === 7 && composer.selectionEnd === 9,
        { active: document.activeElement && document.activeElement.id, value: composer.value, sel: [composer.selectionStart, composer.selectionEnd] });

  // T4 reading old history: anchor must not move when new messages arrive / old ones grow
  const anchorId = "m" + Math.floor(N / 2);
  scroller.querySelector(`[data-id="${anchorId}"]`).scrollIntoView({ block: "start" });
  await frame();
  const before = anchorTop(anchorId), stBefore = scroller.scrollTop;
  server.push({ id: "m" + (Math.floor(N / 2) - 5), role: "assistant", text: synthText(1) + "\n(edited above anchor, taller)\n" + synthText(2), done: true });
  for (let k = 0; k < 5; k++) server.push({ id: "late" + k, role: "assistant", text: synthText(k + 7), done: true });
  view.ingest(server.since(view.store.lastSeq));
  await frame();
  const drift = anchorTop(anchorId) - before;
  check("T4 reading position stable (|drift| <= 1 px) while content above grows and below appends", Math.abs(drift) <= 1,
        { drift: +drift.toFixed(2), scrollTopBefore: stBefore, scrollTopAfter: scroller.scrollTop });

  // T5 duplicates (e.g. replay after reconnect) ignored
  const sizeBefore = view.store.size, dupBefore = view.store.stats.duplicates;
  view.ingest(server.since(view.store.lastSeq - 4));
  check("T5 duplicate events ignored", view.store.size === sizeBefore && view.store.stats.duplicates === dupBefore + 4,
        { size: view.store.size, duplicates: view.store.stats.duplicates - dupBefore });

  // T6 gap: event N+2 arrives before N+1 -> buffered, resync requested from cursor, order correct
  const cur = view.store.lastSeq;
  const e1 = server.push({ id: "g1", role: "assistant", text: "gap-1", done: true });
  const e2 = server.push({ id: "g2", role: "assistant", text: "gap-2", done: true });
  resyncs.length = 0;
  view.ingest([{ ...e2 }]);
  const order = [...scroller.children].slice(-2).map(e => e.dataset.id);
  check("T6 gap detected, resync from cursor, no duplicate, correct order", resyncs[0] === cur && order.join() === "g1,g2" &&
        scroller.querySelectorAll('[data-id="g2"]').length === 1, { resyncs: [...resyncs], order });

  // T7 page hidden -> events queued -> visible -> single catch-up render
  const rendersBefore = view.renders;
  view.setHidden(true);
  for (let k = 0; k < 3; k++) { server.push({ id: "bg" + k, role: "assistant", text: "while hidden " + k, done: true }); view.ingest(server.since(view.store.lastSeq)); }
  const hiddenNodes = scroller.querySelectorAll('[data-id^="bg"]').length;
  view.setHidden(false);
  check("T7 background queue then single catch-up", hiddenNodes === 0 && scroller.querySelectorAll('[data-id^="bg"]').length === 3,
        { hiddenNodes, rendersDuringCatchup: view.renders - rendersBefore });

  // T8 reconnect after "offline": resume from Last-Event-ID style cursor, nothing lost or doubled
  const cursor = view.store.lastSeq;
  for (let k = 0; k < 4; k++) server.push({ id: "off" + k, role: "assistant", text: "missed while offline " + k, done: true });
  view.ingest(server.since(cursor)); // reconnect replays from cursor
  view.ingest(server.since(cursor)); // a second overlapping replay must be harmless
  check("T8 reconnect resume: all missed delivered exactly once", scroller.querySelectorAll('[data-id^="off"]').length === 4,
        { delivered: scroller.querySelectorAll('[data-id^="off"]').length });

  // T9 no navigation/reload happened during the whole run
  check("T9 no page reload", sessionStorage.getItem("loads") === "1" && navType !== "reload" && window.__loadId,
        { loads: sessionStorage.getItem("loads"), navType });

  // T10 content-visibility applied to every message (long-list rendering cost)
  const allCv = [...scroller.children].every(el => el.style.contentVisibility === "auto");
  check("T10 content-visibility:auto on every message node", allCv, { nodes: scroller.children.length,
        supported: CSS.supports("content-visibility", "auto") });

  const summary = { passed: results.filter(r => r.ok).length, failed: results.filter(r => !r.ok).length, total: results.length,
                    userAgent: navigator.userAgent, viewport: [innerWidth, innerHeight], dpr: devicePixelRatio, n: N, results };
  window.__chatResults = summary;
  $("result").textContent = `RESULT ${summary.failed ? "FAIL" : "PASS"} ${summary.passed}/${summary.total}\n` +
    results.map(r => `${r.ok ? "ok  " : "FAIL"} ${r.name} ${JSON.stringify(r.detail)}`).join("\n");
  document.title = `chat-fixture: ${summary.failed ? "FAIL" : "PASS"} ${summary.passed}/${summary.total}`;
}
run().catch(e => { window.__chatResults = { error: String(e && e.stack || e), results }; document.title = "chat-fixture: ERROR"; $("result").textContent = String(e); });
</script>
</body>
</html>
