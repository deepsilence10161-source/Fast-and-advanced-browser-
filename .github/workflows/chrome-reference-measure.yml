name: Stock Chrome reference measurements (x64 emulator; measures only, never publishes)
# Runs the personal build's own measurement scripts against the Chrome that ships on the emulator image,
# so the Chrome column of the comparison is measured, not assumed. Chrome version = the image's version.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: bash scripts/ci/build_clip_helper.sh out/cliphelper.apk
      - uses: actions/upload-artifact@v4
        with: { name: cliphelper-apk, path: out/cliphelper.apk }
  chrome:
    needs: helper
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: cliphelper-apk, path: helper }
      - run: pip install -q websocket-client
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Stock Chrome on x64 emulator (API 36, google_apis)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/ci/chrome_reference_run.sh helper/cliphelper.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chrome-ref-x64, path: out/ }
