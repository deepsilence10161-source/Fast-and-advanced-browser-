name: Secret scan (gitleaks, full history)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GL_VERSION: "8.30.1"
      GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan full git history (redacted)
        run: ./gitleaks git . --log-opts="--all" --redact --no-banner --exit-code 1 --verbose
