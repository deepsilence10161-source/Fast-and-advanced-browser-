name: Explore device capabilities (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Fetch official Chromium snapshots (verified)
        run: |
          pip install -q crc32c
          python3 scripts/fetch_snapshot.py --prefix Android_Arm64 --near 1697595 --out dl/arm64 | tail -25
          python3 scripts/fetch_snapshot.py --prefix AndroidDesktop_x64 --near 1697595 --out dl/desktop_x64 | grep -E 'snapshot_revision|apks' -A3
          find dl -name '*.apk' -printf '%s %p\n'; rm -f dl/*/*.zip; df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probe on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: OUT=out bash scripts/ci/explore_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explore-api${{ matrix.api }}
          path: |
            out/
            dl/*/provenance.json
