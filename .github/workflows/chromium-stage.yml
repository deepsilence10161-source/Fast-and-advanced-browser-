name: Chromium build stage (reusable)
# एक stage = एक standard runner job (<6 h)। scripts/ci/chromium_stage.sh देखें।
on:
  workflow_call:
    inputs:
      tag:   { type: string, required: true }
      cpu:   { type: string, required: true }
      stage: { type: number, required: true }
      variant: { type: string, required: false, default: "a1" }   # state release: crstate-<tag>-<cpu>-<variant>
      seed:    { type: string, required: false, default: "" }     # खाली नई variant के लिए src/out इस variant से
    outputs:
      done:
        value: ${{ jobs.stage.outputs.done }}
    # secrets: caller `secrets: inherit` से। केवल "Release signing" step को मिलते हैं (build step को नहीं)।
permissions:
  contents: write   # build-state के लिए draft release (assets)
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      done: ${{ steps.sign.outputs.done || steps.s.outputs.done }}
    steps:
      - name: Deadline (job start + 290 min compile window)
        run: echo "DEADLINE=$(( $(date +%s) + 290*60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build stage ${{ inputs.stage }}
        id: s
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CPU: ${{ inputs.cpu }}
          STAGE: ${{ inputs.stage }}
          STATE: crstate-${{ inputs.tag }}-${{ inputs.cpu }}-${{ inputs.variant }}
          SEED_STATE: ${{ inputs.seed != '' && format('crstate-{0}-{1}-{2}', inputs.tag, inputs.cpu, inputs.seed) || '' }}
          OUTPUTS_DIR: ${{ runner.temp }}/outputs
        run: bash scripts/ci/chromium_stage.sh
      - name: Release signing + finalize (secrets केवल इस step में)
        id: sign
        if: steps.s.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KS_B64: ${{ secrets.SWIFTRA_KS_B64 }}
          SIGNING_KS_PASS: ${{ secrets.SWIFTRA_KS_PASS }}
        run: bash scripts/ci/finalize_apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crbuild-${{ inputs.tag }}-${{ inputs.cpu }}-${{ inputs.variant }}-s${{ inputs.stage }}
          path: ${{ runner.temp }}/outputs
          if-no-files-found: ignore
          retention-days: 90
