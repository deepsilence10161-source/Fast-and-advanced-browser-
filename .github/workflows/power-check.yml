name: Power check (runner + KVM + Android emulator)
on:
  push:
    branches: [power-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Runner resources
        run: |
          set -x
          nproc; free -h; df -h /; uname -a; cat /etc/os-release | head -3
          ls -la /dev/kvm || echo "NO /dev/kvm"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Boot emulator and smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p out
            adb shell getprop ro.build.version.release > out/android_version.txt
            adb shell getprop ro.product.model >> out/android_version.txt
            adb shell wm size >> out/android_version.txt
            adb shell am start -a android.intent.action.VIEW -d https://example.com || true
            sleep 15
            adb exec-out screencap -p > out/screen.png
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml out/ui.xml || true
            ls -la out
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-check-evidence
          path: out/
