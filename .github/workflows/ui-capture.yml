name: UI capture (Chrome reference vs Chromium artifact, Android emulator)
on:
  workflow_dispatch:
    inputs:
      chromium_position:
        description: "Chromium main-branch position (nearest snapshot >= this). Default = M155 branch point"
        default: "1697595"
      targets:
        description: 'JSON list: chrome_ref, chromium_arm64, chromium_desktop_x64, chromium_source_x64, chromium_source_arm64'
        default: '["chrome_ref","chromium_arm64","chromium_desktop_x64"]'
      source_tag:
        description: "chromium_source_* के लिए: इस परियोजना के source build का Chromium tag"
        default: "155.0.8059.80"
      source_variant:
        description: "chromium_source_* के लिए: state variant (a1 = baseline; branded/patched builds अलग variant में)"
        default: "a1"
      ablation_compilation:
        description: "startup_ablation only: fixed ART state; verify is install-like, speed is full AOT diagnostic"
        type: choice
        options: [speed, verify]
        default: speed
      checks:
        description: "full = regression/publish; other checks = focused native diagnostics/download validation, NEVER publish"
        type: choice
        options: [full, safety_update, startup_ablation, update_download]
        default: full
permissions:
  contents: write   # chromium_source_*: APK draft build-state release में है (drafts केवल write-access को दिखते हैं)। कुछ upload नहीं होता।
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["chrome_ref","chromium_arm64","chromium_desktop_x64"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Fetch official Chromium snapshot (MD5 + CRC32C verified)
        if: matrix.target == 'chromium_arm64' || matrix.target == 'chromium_desktop_x64'
        run: |
          pip install -q crc32c
          PREFIX=$([ "${{ matrix.target }}" = chromium_arm64 ] && echo Android_Arm64 || echo AndroidDesktop_x64)
          python3 scripts/fetch_snapshot.py --prefix $PREFIX --near "${{ inputs.chromium_position || '1697595' }}" --out dl > /dev/null
          rm -f dl/*.zip; python3 -c "import json;d=json.load(open('dl/provenance.json'));print(json.dumps({k:d[k] for k in ('prefix','snapshot_revision','REVISIONS','zip_sha256','zip_crc32c_verified')},indent=1))"
          mkdir -p out/${{ matrix.target }} && cp dl/provenance.json out/${{ matrix.target }}/provenance.json
      - name: Fetch this project's source-built APK (state release) + BUILD_INFO
        if: startsWith(matrix.target, 'chromium_source_')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CPU=${{ matrix.target }}; CPU=${CPU#chromium_source_}; TAG="${{ inputs.source_tag || '155.0.8059.80' }}"
          ST=crstate-$TAG-$CPU-${{ inputs.source_variant || 'a1' }}; mkdir -p dl out/${{ matrix.target }}
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p "ChromePublic-$TAG-$CPU.apk" -O dl/ChromePublic.apk
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p BUILD_INFO.txt -O out/${{ matrix.target }}/BUILD_INFO.txt
          sha256sum dl/ChromePublic.apk; grep -A1 -- '--- sha256' out/${{ matrix.target }}/BUILD_INFO.txt
          test "$(sha256sum dl/ChromePublic.apk | cut -d' ' -f1)" = "$(grep -A1 -- '--- sha256' out/${{ matrix.target }}/BUILD_INFO.txt | tail -1)"
      - uses: actions/setup-java@v4
        if: startsWith(matrix.target, 'chromium_source_')
        with: { distribution: temurin, java-version: "17" }
      - name: Throwaway-key re-signed copy (negative update test)
        if: startsWith(matrix.target, 'chromium_source_') && (inputs.checks == 'full' || inputs.checks == '')
        run: bash scripts/ci/make_foreign_apk.sh dl/ChromePublic.apk "$RUNNER_TEMP/foreign.apk"
      - name: Harness deps
        run: pip install -q websocket-client h2 androguard
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Scripted UI journey on emulator (API 36, Pixel 6 profile)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            bash scripts/ci/run_capture.sh ${{ matrix.target }} "${{ inputs.checks || 'full' }}" "${{ inputs.ablation_compilation || 'speed' }}"
            if [ -f dl/ChromePublic.apk ] && [ -f "$RUNNER_TEMP/foreign.apk" ]; then bash scripts/ci/device_checks.sh ${{ matrix.target }} dl/ChromePublic.apk "$RUNNER_TEMP/foreign.apk"; fi
            if [ -f dl/ChromePublic.apk ]; then bash scripts/ci/diag_dump.sh ${{ matrix.target }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.target }}
          path: out/
  publish:
    # GITHUB_TOKEN-started runs (after-build) do not fire workflow_run, so start publish-latest explicitly.
    # It waits for this run to complete, then gates the APK; a duplicate (also via workflow_run) only finds "already published".
    needs: capture
    if: always() && (inputs.checks == 'full' || inputs.checks == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run publish-latest.yml -R "${{ github.repository }}" --ref main -f e2e_run="${{ github.run_id }}" -f e2e_wf=ui-capture.yml
        env:
          GH_TOKEN: ${{ github.token }}

