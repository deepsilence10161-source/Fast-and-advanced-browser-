name: Device diagnostics (x64 emulator, no APK, never publishes)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "script under scripts/ci/ to run on the emulator"
        default: clipboard_diag.sh
permissions:
  contents: read
jobs:
  x64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run diagnostic on x64 emulator (API 36, google_apis)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/ci/${{ inputs.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: device-diag, path: out/ }
