name: Face Guard device checks (x64 emulator + native ARM64 Redroid; never publishes)
# Real Android runtime evidence for the opt-in Face Guard layer. Manual only. No publish, no update feed.
# probe: real android.media.FaceDetector + repo analyzer code on still images (no camera, no APK).
# Host PASS is never Android PASS.
on:
  workflow_dispatch:
    inputs:
      cpu:
        type: choice
        options: [x64, arm64]
        default: x64
      suite:
        description: "probe = analyzer on still images (no APK); apk = Settings/lock/tab-switcher suite on the personal APK"
        type: choice
        options: [probe, apk, emulator-help, camdiag]
        default: probe
      scenario:
        description: "apk suite, x64 only: nofaces (front camera = emulated scene) | one | two (front camera renders a committed face image)"
        type: choice
        options: [nofaces, one, two]
        default: nofaces
      orient:
        description: "image orientation fed to the emulator: rot0 = acceptance (measured: emulator front camera sensor=90), rot90 = information only"
        type: choice
        options: [rot0, rot90]
        default: rot0
      variant:
        default: personal-dev
      tag:
        default: "155.0.8059.80"
      redroid_image:
        default: "redroid/redroid:14.0.0_64only-latest"
permissions:
  contents: write   # the draft state release holding the APK is only visible with write access; nothing is uploaded
jobs:
  emulator-help:
    if: inputs.suite == 'emulator-help'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Print emulator camera options (front virtualscene + poster) and camera HAL view
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front emulated -no-snapshot
          disable-animations: true
          script: bash scripts/ci/emulator_camera_info.sh
  build-probe:
    if: inputs.suite == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: BUILD_ONLY=1 bash scripts/ci/face_guard_probe.sh out/probe_build
      - uses: actions/upload-artifact@v4
        with: { name: face-probe-dex, path: out/probe_build/probe.dex }
  probe-x64:
    needs: build-probe
    if: inputs.cpu == 'x64' && inputs.suite == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: face-probe-dex, path: probe_dex }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Face probe on x64 emulator (API 36)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: PROBE_DEX=probe_dex/probe.dex bash scripts/ci/face_guard_probe.sh out/face_x64
      - name: Evaluate probe expectations
        run: python3 scripts/ci/face_guard_probe_check.py out/face_x64/face_probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: face-guard-x64, path: out/ }
  probe-arm64:
    needs: build-probe
    if: inputs.cpu == 'arm64' && inputs.suite == 'probe'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: face-probe-dex, path: probe_dex }
      - name: Host + binder kernel module
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; }
          sudo apt-get install -y -qq adb >/dev/null
      - name: Boot Redroid (native arm64 Android)
        run: |
          mkdir -p "$RUNNER_TEMP/rd"
          docker run -d --name rd --privileged -v "$RUNNER_TEMP/rd:/data" -p 5555:5555 "${{ inputs.redroid_image }}" \
            androidboot.redroid_width=1080 androidboot.redroid_height=2400 androidboot.redroid_dpi=420 androidboot.redroid_gpu_mode=guest
          for i in $(seq 1 60); do adb connect 127.0.0.1:5555 >/dev/null 2>&1
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { echo "booted after ~$((i*5)) s"; break; }; sleep 5; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
      - name: Face probe on native ARM64 Redroid
        run: |
          PROBE_DEX=probe_dex/probe.dex bash scripts/ci/face_guard_probe.sh out/face_arm64
      - name: Evaluate probe expectations
        run: python3 scripts/ci/face_guard_probe_check.py out/face_arm64/face_probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: face-guard-arm64, path: out/ }
  camdiag-x64:
    if: inputs.cpu == 'x64' && inputs.suite == 'camdiag'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: pip install -q pillow && python3 tools/face_guard/make_cam_fixtures.py "$PWD/camfx" && bash scripts/ci/build_clip_helper.sh "$PWD/helper/cliphelper.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Camera diagnostics on x64 emulator (front camera = committed face image)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front ${{ format('imagefile:{0}/camfx/cam_{1}_{2}.jpg', github.workspace, inputs.scenario == 'nofaces' && 'one' || inputs.scenario, inputs.orient) }} -no-snapshot
          disable-animations: true
          script: bash scripts/ci/camdiag_run.sh out/camdiag helper/cliphelper.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: camdiag-x64, path: out/ }
  apk-x64:
    if: inputs.cpu == 'x64' && inputs.suite == 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Fetch personal development APK + BUILD_INFO (SHA-256 must match)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ST=crstate-${{ inputs.tag }}-x64-${{ inputs.variant }}; T=face_x64; mkdir -p dl out/$T
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p "ChromePublic-${{ inputs.tag }}-x64.apk" -O dl/ChromePublic.apk
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p BUILD_INFO.txt -O out/$T/BUILD_INFO.txt
          test "$(sha256sum dl/ChromePublic.apk | cut -d' ' -f1)" = "$(grep -A1 -- '--- sha256' out/$T/BUILD_INFO.txt | tail -1)"
          grep -E "^(package|application-label|native-code)" out/$T/BUILD_INFO.txt
          grep -c "0105-face-guard-presence-mode.patch" out/$T/BUILD_INFO.txt
      - run: pip install -q websocket-client pillow && python3 tools/face_guard/make_cam_fixtures.py "$PWD/camfx"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Face Guard suite on x64 emulator (API 36, front camera = emulated scene, no face)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front ${{ inputs.scenario == 'nofaces' && 'emulated' || format('imagefile:{0}/camfx/cam_{1}_{2}.jpg', github.workspace, inputs.scenario, inputs.orient) }} -no-snapshot
          disable-animations: true
          script: FG_SCRIPT=${{ inputs.scenario == 'nofaces' && 'face_guard_e2e.py' || 'face_guard_face_e2e.py' }} FG_ARGS="${{ inputs.scenario == 'nofaces' && ' ' || format('--scenario {0} --variant {1}', inputs.scenario, inputs.orient) }}" bash scripts/ci/face_guard_e2e_run.sh face_x64 dl/ChromePublic.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: face-guard-apk-x64, path: out/ }
  apk-arm64:
    if: inputs.cpu == 'arm64' && inputs.suite == 'apk'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Host + binder kernel module
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; }
          sudo apt-get install -y -qq adb >/dev/null
      - name: Boot Redroid (native arm64 Android)
        run: |
          mkdir -p "$RUNNER_TEMP/rd"
          docker run -d --name rd --privileged -v "$RUNNER_TEMP/rd:/data" -p 5555:5555 "${{ inputs.redroid_image }}" \
            androidboot.redroid_width=1080 androidboot.redroid_height=2400 androidboot.redroid_dpi=420 androidboot.redroid_gpu_mode=guest
          for i in $(seq 1 60); do adb connect 127.0.0.1:5555 >/dev/null 2>&1
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { echo "booted after ~$((i*5)) s"; break; }; sleep 5; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0; adb shell settings put global transition_animation_scale 0; adb shell settings put global animator_duration_scale 0
      - name: Fetch personal development APK + BUILD_INFO (SHA-256 must match)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ST=crstate-${{ inputs.tag }}-arm64-${{ inputs.variant }}; T=face_arm64; mkdir -p dl out/$T
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p "ChromePublic-${{ inputs.tag }}-arm64.apk" -O dl/ChromePublic.apk
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p BUILD_INFO.txt -O out/$T/BUILD_INFO.txt
          test "$(sha256sum dl/ChromePublic.apk | cut -d' ' -f1)" = "$(grep -A1 -- '--- sha256' out/$T/BUILD_INFO.txt | tail -1)"
          grep -E "^(package|application-label|native-code)" out/$T/BUILD_INFO.txt
          grep -c "0105-face-guard-presence-mode.patch" out/$T/BUILD_INFO.txt
      - run: pip install -q websocket-client pillow
      - name: Face Guard suite on native ARM64 Redroid
        run: bash scripts/ci/face_guard_e2e_run.sh face_arm64 dl/ChromePublic.apk
      - name: Meta
        if: always()
        run: |
          mkdir -p out/face_arm64; adb shell getprop > out/face_arm64/getprop.txt 2>/dev/null || true
          docker logs rd 2>&1 | tail -100 > out/face_arm64/redroid_container.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: face-guard-apk-arm64, path: out/ }
