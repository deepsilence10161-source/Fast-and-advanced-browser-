name: Personal clipboard-leak E2E (x64 emulator; never publishes)
# Measures whether text copied in the personal development APK reaches the SYSTEM clipboard (scripts/ci/personal_clipboard_e2e.py).
on:
  workflow_dispatch:
    inputs:
      cpu:
        type: choice
        options: [x64, arm64]
        default: x64
      redroid_image: { default: "redroid/redroid:14.0.0_64only-latest" }
      script:
        description: "which E2E under scripts/ci/"
        type: choice
        options: [personal_clipboard_e2e.py, personal_autofill_e2e.py, personal_cred_e2e.py, personal_forensics_e2e.py]
        default: personal_clipboard_e2e.py
      variant: { description: "state variant", default: personal-dev }
      tag: { default: "158.0.8127.42" }
      expect:
        description: "clipboard expectation: system (0112+ builds, copy must work) or contained (older builds)"
        type: choice
        options: [system, contained]
        default: system
env:
  CLIP_EXPECT: ${{ inputs.expect }}
permissions:
  contents: write   # draft state release is only visible with write access; nothing is uploaded
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: bash scripts/ci/build_clip_helper.sh out/cliphelper.apk
      - uses: actions/upload-artifact@v4
        with: { name: cliphelper-apk, path: out/cliphelper.apk }
  x64:
    if: inputs.cpu == 'x64'
    needs: helper
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: cliphelper-apk, path: helper }
      - name: Fetch personal development APK + BUILD_INFO (SHA-256 must match)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ST=crstate-${{ inputs.tag }}-x64-${{ inputs.variant }}; T=personal_clip_x64; mkdir -p dl out/$T
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p "ChromePublic-${{ inputs.tag }}-x64.apk" -O dl/ChromePublic.apk
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p BUILD_INFO.txt -O out/$T/BUILD_INFO.txt
          test "$(sha256sum dl/ChromePublic.apk | cut -d' ' -f1)" = "$(grep -A1 -- '--- sha256' out/$T/BUILD_INFO.txt | tail -1)"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Clipboard E2E on x64 emulator (API 36, google_apis)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: E2E_SCRIPT=${{ inputs.script }} bash scripts/ci/personal_clipboard_run.sh personal_clip_x64 dl/ChromePublic.apk helper/cliphelper.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: personal-clip-x64, path: out/ }
  arm64:
    if: inputs.cpu == 'arm64'
    needs: helper
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: cliphelper-apk, path: helper }
      - name: Host + binder kernel module
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; }
          sudo modprobe ashmem_linux 2>/dev/null || true
          sudo apt-get install -y -qq adb >/dev/null
      - name: Boot Redroid (native arm64 Android)
        run: |
          mkdir -p "$RUNNER_TEMP/rd"
          docker run -d --name rd --privileged -v "$RUNNER_TEMP/rd:/data" -p 5555:5555 "${{ inputs.redroid_image }}" \
            androidboot.redroid_width=1080 androidboot.redroid_height=2400 androidboot.redroid_dpi=420 androidboot.redroid_gpu_mode=guest
          for i in $(seq 1 60); do adb connect 127.0.0.1:5555 >/dev/null 2>&1
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { echo "booted after ~$((i*5)) s"; break; }; sleep 5; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0; adb shell settings put global transition_animation_scale 0; adb shell settings put global animator_duration_scale 0
      - name: Fetch personal development APK + BUILD_INFO (SHA-256 must match)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ST=crstate-${{ inputs.tag }}-arm64-${{ inputs.variant }}; T=personal_clip_arm64; mkdir -p dl out/$T
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p "ChromePublic-${{ inputs.tag }}-arm64.apk" -O dl/ChromePublic.apk
          gh release download "$ST" -R "$GITHUB_REPOSITORY" -p BUILD_INFO.txt -O out/$T/BUILD_INFO.txt
          test "$(sha256sum dl/ChromePublic.apk | cut -d' ' -f1)" = "$(grep -A1 -- '--- sha256' out/$T/BUILD_INFO.txt | tail -1)"
      - run: pip install -q websocket-client
      - name: Clipboard E2E on native ARM64 Redroid
        env: { E2E_SCRIPT: "${{ inputs.script }}" }
        run: bash scripts/ci/personal_clipboard_run.sh personal_clip_arm64 dl/ChromePublic.apk helper/cliphelper.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: personal-clip-arm64, path: out/ }
